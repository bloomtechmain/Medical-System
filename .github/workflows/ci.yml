name: CI - Check Code Quality

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  check-server:
    name: Server — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Audit server dependencies (critical)
        working-directory: ./server
        run: npm audit --audit-level=critical

      - name: Lint server
        working-directory: ./server
        run: npm run lint

      - name: Build server
        working-directory: ./server
        run: npm run build

      - name: Run controller tests
        working-directory: ./server
        run: npm test

  check-client:
    name: Client — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Audit client dependencies (critical)
        working-directory: ./client
        run: npm audit --audit-level=critical

      - name: Lint client
        working-directory: ./client
        run: npm run lint

      - name: Build client
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
          VITE_WS_URL: ws://localhost:5000

  # SEC-19: scans the actual built images, not just source dependencies —
  # catches vulnerable OS packages baked into the base image too.
  image-scan:
    name: Docker image scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: ./server
          - name: client
            context: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: corehealth-${{ matrix.name }}:ci

      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: corehealth-${{ matrix.name }}:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
