name: CI - Check Code Quality

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # SEC-07: catches secrets committed anywhere in history, not just the
  # current tree — a .env accidentally added-then-removed still leaks via
  # `git log`/`git show` otherwise.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-server:
    name: Server — Lint & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corehealth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      # SEC-18/WARN-19: critical is a hard gate (no continue-on-error) —
      # true criticals are rare enough that this doesn't generate the kind
      # of pre-existing-noise problem a `high` threshold would.
      - name: Audit server dependencies (critical)
        working-directory: ./server
        run: npm audit --audit-level=critical

      - name: Lint server
        working-directory: ./server
        run: npm run lint

      - name: Build server
        working-directory: ./server
        run: npm run build

      # Fresh DB every run, so this always takes the "brand-new database" path
      # (runs 001_initial_schema.sql for real) — never the BASELINE.md path.
      - name: Run migrations against the CI database
        working-directory: ./server
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corehealth_ci

      - name: Run controller tests (including real-DB RLS integration tests)
        working-directory: ./server
        run: npm test
        env:
          # corehealth_app — the non-superuser, non-BYPASSRLS role — not the
          # postgres service's superuser used for migrations above. Running
          # the RLS integration tests as a superuser would silently bypass
          # the thing they're supposed to prove.
          DATABASE_URL: postgresql://corehealth_app:change_me_in_prod@localhost:5432/corehealth_ci
          DB_SSL: "false" # the postgres:16 service container has no TLS configured

      # PERF-06: proves pg-boss can actually migrate its own schema (CREATE
      # TABLE inside `pgboss`) under corehealth_app's limited privileges —
      # the unit tests mock pg-boss entirely, so nothing else catches a
      # missing/wrong grant from 003_job_queue_schema.sql before production does.
      - name: Smoke-test the job queue as the app's own (non-superuser) role
        working-directory: ./server
        run: npx tsx scripts/smokeTestQueue.ts
        env:
          DATABASE_URL: postgresql://corehealth_app:change_me_in_prod@localhost:5432/corehealth_ci
          DB_SSL: "false"

  check-client:
    name: Client — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Audit client dependencies (critical)
        working-directory: ./client
        run: npm audit --audit-level=critical

      - name: Lint client
        working-directory: ./client
        run: npm run lint

      - name: Build client
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
          VITE_WS_URL: ws://localhost:5000

  # SEC-19: scans the actual built images, not just source dependencies —
  # catches vulnerable OS packages baked into the base image too.
  image-scan:
    name: Docker image scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: ./server
          - name: client
            context: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: corehealth-${{ matrix.name }}:ci

      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: corehealth-${{ matrix.name }}:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
