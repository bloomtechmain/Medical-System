name: CI - Check Code Quality

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  check-server:
    name: Server — Lint & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corehealth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Lint server
        working-directory: ./server
        run: npm run lint
        continue-on-error: true

      - name: Build server
        working-directory: ./server
        run: npm run build

      # Fresh DB every run, so this always takes the "brand-new database" path
      # (runs 001_initial_schema.sql for real) — never the BASELINE.md path.
      - name: Run migrations against the CI database
        working-directory: ./server
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corehealth_ci

      - name: Run controller tests (including real-DB RLS integration tests)
        working-directory: ./server
        run: npm test
        env:
          # corehealth_app — the non-superuser, non-BYPASSRLS role — not the
          # postgres service's superuser used for migrations above. Running
          # the RLS integration tests as a superuser would silently bypass
          # the thing they're supposed to prove.
          DATABASE_URL: postgresql://corehealth_app:change_me_in_prod@localhost:5432/corehealth_ci
          DB_SSL: "false" # the postgres:16 service container has no TLS configured

  check-client:
    name: Client — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint client
        working-directory: ./client
        run: npm run lint
        continue-on-error: true

      - name: Build client
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
          VITE_WS_URL: ws://localhost:5000
