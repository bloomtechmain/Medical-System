name: Deploy

# CICD-01/04/05/06/09/10/13 and BKP-09.
#
# What was wrong: code reached production through Railway's automatic deploy
# from GitHub, entirely outside this pipeline. So nothing guaranteed a deploy
# waited for CI (CICD-01), each service was rebuilt from source per
# environment rather than one image being promoted (CICD-04), the auto-created
# v1.2.3 tag was not what got deployed (CICD-05), there was no staging step
# (CICD-06), no post-deploy smoke test (CICD-09), no approval gate (CICD-10),
# no team notification (CICD-13), and nothing took a backup before migrations
# ran (BKP-09).
#
# ──────────────────────────────────────────────────────────────────────────
# Both staging AND production deploy to AWS (ECS + RDS + S3/CloudFront,
# infra/terraform) — Railway is no longer a deploy target at all. This
# changed with the suwela.com domain cutover (docs/decisions/0006-three-
# domain-split.md), which pulled the trigger docs/decisions/0002-railway-
# then-aws.md had been waiting on. Each environment's server image CMD runs
# migrations on every container start (server/Dockerfile) — a broken
# migration fails that task's healthcheck, the rolling ECS deployment never
# stabilizes, and `aws ecs wait services-stable` below fails the job, while
# the OLD tasks keep serving traffic throughout. Neither environment runs a
# separate "migrate from CI" step: both RDS instances are private, with no
# route from a GitHub-hosted runner.
#
# THIS WORKFLOW DOES NOT RUN UNTIL IT IS CONFIGURED. Every job is gated on a
# secret or variable being present, so merging it changes nothing until
# someone sets these up. That is deliberate: the alternative is a workflow
# that fails on every push.
#
# To switch on an environment → AWS (repeat per environment: `staging` and
# `production` are separate GitHub Environments with their own variables):
#   1. Create the GitHub environment (Settings → Environments) if it
#      doesn't exist. Add required reviewers to `production` — that is
#      CICD-10, and it is a settings change, not a code change.
#   2. `terraform apply` infra/terraform (matching workspace) — this adds
#      the GitHub OIDC provider + deploy role (github_actions.tf) alongside
#      everything else for that environment.
#   3. `terraform output` and copy the values in:
#        Repo secret:    AWS_ROLE_ARN              = output github_actions_deploy_role_arn
#        Repo variables: AWS_REGION                = ap-south-1 (or whatever aws_region was)
#                         ECR_REPOSITORY_URL        = output ecr_repository_url
#                         ECS_CLUSTER               = <environment>-corehealth
#                         ECS_SERVICE               = output ecs_service_name
#                         RDS_INSTANCE_IDENTIFIER   = output db_instance_identifier
#                         S3_FRONTEND_BUCKET        = output frontend_bucket_name
#                         CLOUDFRONT_DISTRIBUTION_ID = output cloudfront_distribution_id
#                         API_BASE_URL              = https://api.suwela.com once DNS + the ALB cert are live, the raw alb_dns_name output until then
#      Additionally, REPO-level (not per-environment) var
#      `ECR_REPOSITORY_URL_<ENV>` for every environment past the first —
#      the `build` job below has no `environment:` of its own, so it can
#      only read repo-level vars, yet still needs to push to every
#      environment's ECR repo in one step. Whichever environment's role
#      has `ref:refs/heads/main` OIDC trust (the one actually used by
#      `build`) also needs `extra_ecr_repository_arns` in its tfvars set
#      to every other environment's repo ARN — see github_actions.tf.
#                         SITE_URL / APP_URL / DASHBOARD_URL = https://www.suwela.com / https://app.suwela.com / https://dashboard.suwela.com (production only — leave unset on staging, which still serves as one undivided origin)
#      (No AWS_ROLE_ARN per environment, no long-lived access keys: the
#      `build` job and both deploy jobs assume this one role via OIDC per
#      environment — see github_actions.tf for why one role is enough here.)
#   4. Set per-environment secrets for the smoke test (reused as-is):
#        SMOKE_BASE_URL          the ALB URL (or api.suwela.com)
#        SMOKE_CLIENT_URL        the CloudFront URL (or the site-zone domain)
#        SMOKE_TEST_EMAIL/PASSWORD  a dedicated low-privilege test account
#        SLACK_WEBHOOK_URL       optional, for CICD-13
#   5. Set repository variable DEPLOY_ENABLED = "true".
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_staging:
        description: "Deploy straight to production (incident fixes only)"
        type: boolean
        default: false

concurrency:
  # Never let two deploys of the same branch overlap — the loser would race
  # the winner's migrations. Do not cancel in progress: a half-finished
  # migration is worse than a queued deploy.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for the aws-actions/configure-aws-credentials OIDC exchange below

jobs:
  preflight:
    name: Should this run?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.DEPLOY_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_ENABLED is not set to 'true' — skipping. See the header of this workflow file."
          fi

  # CICD-01: the deploy waits for CI, rather than running beside it.
  ci:
    name: CI must pass first
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    uses: ./.github/workflows/ci.yml

  # CICD-04: build each artifact ONCE, here, and promote that exact artifact
  # to staging (and, for the client, nothing environment-specific is baked in
  # to begin with — see the client build step below). Nothing is rebuilt per
  # environment, so what was tested in staging is bit-for-bit what reaches
  # production.
  # CICD-05: tagged with the commit SHA, and the SHA is what gets deployed.
  build:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # The default `docker` driver can't export cache (cache-to below) —
      # only the docker-container driver this creates can.
      - uses: docker/setup-buildx-action@v3

      # Server only — the client is not an ECS service on AWS, see the
      # client build step below.
      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          # Pushed to every environment's ECR repo in this one step (CICD-04:
          # build once, promote the exact same image everywhere) — this job
          # has no `environment:`, so it authenticates as whichever
          # environment's role has `ref:refs/heads/main` trust (currently
          # staging's — see infra/terraform/github_actions.tf), and that
          # role additionally has ECR push rights on every OTHER
          # environment's repo too (extra_ecr_repository_arns in its
          # tfvars), specifically so this list can grow past one repo.
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.tag }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
            ${{ vars.ECR_REPOSITORY_URL_PRODUCTION }}:${{ steps.meta.outputs.tag }}
            ${{ vars.ECR_REPOSITORY_URL_PRODUCTION }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Stamps the release into the image so logs and Sentry events can be
          # tied to a deploy (MON-05/MON-10).
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}

      # The client is served as a static build from S3/CloudFront, not a
      # container, on AWS (infra/terraform/modules/edge). Its runtime config
      # (window.__APP_CONFIG__.API_URL) is written at deploy time, not here —
      # see scripts/deploy/write-client-config.sh — because nothing
      # environment-specific is baked into this build, which is exactly what
      # lets it be built once and promoted like the server image.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the frontend
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  # CICD-06: staging first. Until a staging environment actually exists this
  # job is skipped by its own `if`, and the chain still works — production
  # then depends on a skipped job, which is why it uses `always()` plus an
  # explicit result check rather than plain `needs`.
  deploy-staging:
    name: Deploy to staging
    needs: build
    if: ${{ !inputs.skip_staging }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # BKP-09: nothing took a backup before a schema change — migrations were
      # run by hand from a laptop or the Railway shell. This snapshots first
      # and WAITS for it, so the backup exists before the new task definition
      # below ever starts a task (and runs its migration on boot).
      - name: Snapshot the database before deploying
        env:
          RDS_INSTANCE_IDENTIFIER: ${{ vars.RDS_INSTANCE_IDENTIFIER }}
        run: ./scripts/deploy/snapshot-database.sh staging

      # CICD-04/05 continued: point the existing task definition at the exact
      # image this run built, rather than retagging "latest" and hoping a
      # force-new-deployment re-pulls it.
      - name: Register a new ECS task definition with the freshly-built image
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_SERVICE }}" \
            --query 'taskDefinition' > taskdef.json

          jq --arg IMAGE "${{ vars.ECR_REPOSITORY_URL }}:${{ needs.build.outputs.image_tag }}" \
             '.containerDefinitions[0].image = $IMAGE
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             taskdef.json > new-taskdef.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=${NEW_ARN}" >> "$GITHUB_OUTPUT"

      # The rolling deployment keeps at least 50% of capacity up throughout
      # (deployment_minimum_healthy_percent in infra/terraform/modules/compute
      # /ecs.tf) — a deploy never drops the API to zero, and if the new
      # task's migration-on-boot fails, this wait times out and fails the
      # job while the old tasks are still serving.
      - name: Update the service and wait for it to stabilize
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist

      - name: Point the build at this environment's API and publish it
        env:
          API_URL: ${{ vars.API_BASE_URL }}
        run: |
          ./scripts/deploy/write-client-config.sh client-dist
          aws s3 sync client-dist/ "s3://${{ vars.S3_FRONTEND_BUCKET }}/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" >/dev/null

      # CICD-09: no smoke test ran after a deploy, so a deploy that broke
      # login was found by a user.
      #
      # SMOKE_INSECURE_TLS: staging's ALB has no real domain yet
      # (infra/terraform/staging.tfvars: domain_name = null), so its 443
      # listener serves a self-signed placeholder cert — every TLS-verifying
      # client, this smoke test included, failed the handshake before getting
      # any HTTP response at all. Staging-only: production's SMOKE_INSECURE_TLS
      # is deliberately left unset below, so it keeps verifying TLS for real.
      # Remove this once staging has a real domain_name + DNS-validated ACM
      # cert (infra/terraform/variables.tf) and SMOKE_BASE_URL points at it.
      - name: Smoke test
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_CLIENT_URL: ${{ secrets.SMOKE_CLIENT_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          SMOKE_INSECURE_TLS: "true"
        run: ./scripts/deploy/smoke-test.sh

  # CICD-10: the `production` GitHub environment carries required reviewers,
  # so this job waits for a human before it starts.
  #
  # AWS, same as staging (docs/decisions/0002-railway-then-aws.md's trigger —
  # the three-subdomain domain cutover, docs/decisions/0006 — was pulled;
  # Railway is no longer deployed to at all). Mirrors deploy-staging exactly:
  # same reasoning for container-boot migrations applies here too, now that
  # production's RDS is equally private and equally unreachable from a
  # GitHub-hosted runner — there is no longer a Railway-shaped reason for
  # production to migrate differently from staging.
  deploy-production:
    name: Deploy to production
    needs: [build, deploy-staging]
    if: always() && needs.build.result == 'success' && needs.deploy-staging.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Snapshot the database before deploying
        env:
          RDS_INSTANCE_IDENTIFIER: ${{ vars.RDS_INSTANCE_IDENTIFIER }}
        run: ./scripts/deploy/snapshot-database.sh production

      - name: Register a new ECS task definition with the freshly-built image
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_SERVICE }}" \
            --query 'taskDefinition' > taskdef.json

          jq --arg IMAGE "${{ vars.ECR_REPOSITORY_URL }}:${{ needs.build.outputs.image_tag }}" \
             '.containerDefinitions[0].image = $IMAGE
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             taskdef.json > new-taskdef.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=${NEW_ARN}" >> "$GITHUB_OUTPUT"

      - name: Update the service and wait for it to stabilize
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist

      - name: Point the build at this environment's API and publish it
        env:
          API_URL: ${{ vars.API_BASE_URL }}
          # The three-subdomain split (docs/decisions/0006): one build,
          # three zone origins baked into dist/config.js at deploy time, same
          # mechanism as API_URL (ARCH-04) — see write-client-config.sh.
          SITE_URL: ${{ vars.SITE_URL }}
          APP_URL: ${{ vars.APP_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          ./scripts/deploy/write-client-config.sh client-dist
          aws s3 sync client-dist/ "s3://${{ vars.S3_FRONTEND_BUCKET }}/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" >/dev/null

      - name: Smoke test
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_CLIENT_URL: ${{ secrets.SMOKE_CLIENT_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: ./scripts/deploy/smoke-test.sh

      # CICD-13: a release was announced on a green CI run, which is not a
      # deploy. This fires on an actual production deploy, and says whether it
      # worked.
      # The `secrets` context is not available in `if:`, so the "is it
      # configured" check has to happen inside the step.
      - name: Tell the team
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::SLACK_WEBHOOK_URL not set — skipping team notification (CICD-13)."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"text":"Production deploy %s — %s (%s) by %s\n%s"}' \
                  "$STATUS" "$TAG" "${GITHUB_SHA::12}" "$GITHUB_ACTOR" \
                  "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
