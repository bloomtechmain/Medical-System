name: Deploy

# Production deploy for the lean "Option A" setup in the production07@bloomtech.lk
# AWS account (infra/lean). Budget ceiling: $46.40/month — there is no
# staging environment, on purpose; test locally before merging to main.
#
#   push to main → CI (ci.yml) must pass → build the server image ONCE and
#   the website ONCE → snapshot the database → roll the one ECS task onto the
#   new image (migrations run on container start; a failing migration never
#   gets healthy and the circuit breaker rolls back) → publish the website to
#   S3/CloudFront → smoke test → notify.
#
# Downtime per deploy: ~30–60 s (one server, fixed ports: the old task stops
# before the new one starts). Deploy at quiet hours.
#
# DOES NOT RUN until repo variable DEPLOY_ENABLED = "true".
#
# Configure from `terraform output` in infra/lean (see infra/lean/README.md):
#   Repo secret:     AWS_ROLE_ARN               = github_deploy_role_arn
#   Repo variables:  AWS_REGION                 = ap-south-1
#                    ECR_REPOSITORY_URL         = ecr_repository_url
#                    ECS_CLUSTER                = ecs_cluster_name
#                    ECS_SERVICE                = ecs_service_name
#                    RDS_INSTANCE_IDENTIFIER    = db_instance_identifier
#                    S3_FRONTEND_BUCKET         = frontend_bucket_name
#                    CLOUDFRONT_DISTRIBUTION_ID = cloudfront_distribution_id
#                    API_BASE_URL               = https://api.suwela.com
#                    SITE_URL / APP_URL / DASHBOARD_URL
#                      = https://www.suwela.com / https://app.suwela.com / https://dashboard.suwela.com
#                      (admin.suwela.com is recognised by the app as a second
#                      name for the dashboard zone; it needs no variable)
#   Environment `production` secrets (optional): SMOKE_TEST_EMAIL /
#   SMOKE_TEST_PASSWORD for a login check, SLACK_WEBHOOK_URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # A half-finished migration is worse than a queued deploy.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC exchange with AWS — no long-lived AWS keys in GitHub

jobs:
  preflight:
    name: Should this run?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.DEPLOY_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_ENABLED is not 'true' — skipping. See the header of this workflow."
          fi

  ci:
    name: CI must pass first
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.tag }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the website
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  deploy-production:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Snapshot the database before deploying
        env:
          RDS_INSTANCE_IDENTIFIER: ${{ vars.RDS_INSTANCE_IDENTIFIER }}
          # Keeps the newest 3 — older pre-deploy snapshots would slowly push
          # backup storage past the free allowance (and past the budget).
          SNAPSHOT_KEEP: "3"
        run: ./scripts/deploy/snapshot-database.sh production

      - name: Register a task definition with the new image
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_SERVICE }}" \
            --query 'taskDefinition' > taskdef.json

          jq --arg IMAGE "${{ vars.ECR_REPOSITORY_URL }}:${{ needs.build.outputs.image_tag }}" \
             '.containerDefinitions[0].image = $IMAGE
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             taskdef.json > new-taskdef.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=${NEW_ARN}" >> "$GITHUB_OUTPUT"

      - name: Roll the service onto it
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist

      - name: Publish the website
        env:
          API_URL: ${{ vars.API_BASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          APP_URL: ${{ vars.APP_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        # Served by the server's HTTPS proxy with Cloudflare caching in front
        # (infra/lean). Cache headers decide what Cloudflare may keep:
        # index.html and config.js never (a deploy shows immediately),
        # hashed assets/* for a year, everything else an hour.
        run: |
          ./scripts/deploy/write-client-config.sh client-dist
          B="s3://${{ vars.S3_FRONTEND_BUCKET }}"
          aws s3 sync client-dist/ "$B/" --delete \
            --exclude index.html --exclude config.js --exclude 'assets/*' \
            --cache-control "public, max-age=3600"
          aws s3 sync client-dist/assets/ "$B/assets/" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp client-dist/index.html "$B/index.html" --cache-control no-cache --content-type "text/html; charset=utf-8"
          aws s3 cp client-dist/config.js "$B/config.js" --cache-control no-cache --content-type application/javascript
          # Only if CloudFront is switched on (infra/lean enable_cloudfront).
          if [ -n "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*" >/dev/null
          fi

      - name: Smoke test
        env:
          SMOKE_BASE_URL: ${{ vars.API_BASE_URL }}
          SMOKE_CLIENT_URL: ${{ vars.SITE_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: ./scripts/deploy/smoke-test.sh

      - name: Tell the team
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::SLACK_WEBHOOK_URL not set — skipping team notification."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"text":"Production deploy %s — %s (%s) by %s\n%s"}' \
                  "$STATUS" "$TAG" "${GITHUB_SHA::12}" "$GITHUB_ACTOR" \
                  "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
