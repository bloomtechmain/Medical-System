# Local, production-shaped stack for load-testing (ARCH-09) without AWS —
# builds the same Dockerfiles used for the real deployment, running
# NODE_ENV=production so the same CORS/env-validation code paths are
# exercised as the real thing, just on this machine instead of AWS.
#
# Usage:
#   docker compose up --build
#   # once healthy:
#   TARGET_URL=http://localhost:5000 node scripts/loadtest/run.js
#
# This is a closer approximation of production than the `npm run dev`
# servers (compiled build, not nodemon/vite-dev; production CORS behavior),
# but it's still one container on one laptop — see docs/capacity-plan.md
# for what this can and can't tell you.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-corehealth}
      POSTGRES_USER: ${DB_USER:-corehealth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-corehealth_dev_only}
    volumes:
      - ./corehealth_database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # offset from 5432 so this doesn't collide with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-corehealth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-corehealth}
      DB_USER: ${DB_USER:-corehealth}
      DB_PASSWORD: ${DB_PASSWORD:-corehealth_dev_only}
      JWT_SECRET: ${JWT_SECRET:-local_loadtest_only_not_for_real_use}
      CLIENT_URL: http://localhost:3000
      # PRO-15: the API enqueues OCR jobs but does not process them — the
      # `worker` service below does, in its own container with its own memory
      # limit. Set QUEUE_WORKER_MODE=inline on both to go back to one process.
      QUEUE_WORKER_MODE: ${QUEUE_WORKER_MODE:-separate}
      # Email verification needs a mail path; without SMTP_HOST the link is
      # logged to the server's console, which is enough to test the flow
      # locally (`docker compose logs server`).
      FEATURE_REQUIRE_EMAIL_VERIFICATION: ${FEATURE_REQUIRE_EMAIL_VERIFICATION:-true}
      # AWS_S3_BUCKET / REDIS_URL / CLAMAV_HOST intentionally unset — exercises
      # the local-disk, in-memory-adapter and no-virus-scan fallback paths
      # (ARCH-06, ARCH-05, PRO-07), same as today.
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # PRO-15/PERF-06: OCR and PDF extraction in their own process. Same image as
  # the API — only the command and the memory ceiling differ, which is the
  # whole point: a tesseract.js job that exhausts memory now kills this
  # container and gets retried, instead of taking the API down with it.
  worker:
    build: ./server
    command: ["sh", "-c", "node dist/worker.js"]
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-corehealth}
      DB_USER: ${DB_USER:-corehealth}
      DB_PASSWORD: ${DB_PASSWORD:-corehealth_dev_only}
      QUEUE_WORKER_MODE: ${QUEUE_WORKER_MODE:-separate}
      # Deliberately higher than the API's 512MB: this is where the
      # memory-hungry work lives now, and giving it room is the reason for
      # splitting it out.
      NODE_OPTIONS: "--max-old-space-size=1024"
    # No JWT_SECRET and no ports: the worker signs no tokens and serves no
    # public traffic. Its health endpoint stays on the compose network.
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      args: {}
    environment:
      API_URL: http://localhost:5000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
